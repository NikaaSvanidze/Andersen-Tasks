spring:
  datasource:
    url: jdbc:mysql://localhost:3306/my_ticket_service_db
    username: postgres
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
      app:
        feature:
          userTicketUpdateEnabled: true